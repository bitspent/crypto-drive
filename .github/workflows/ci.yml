# Fast gates on every push and PR: lint, unit, production build.
# The browser suite stays manual (needs browsers + minutes) — see
# tests/e2e/README.md "Run in CI" for the self-hosted commands.
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: CERT_HASH_SECRET=ci npm run build
