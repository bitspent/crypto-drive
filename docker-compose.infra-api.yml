# Local regtest dev: runs ONLY the infra-api service, pointed at Nigiri's
# ports on the host. Do not hand-write the Bitcoin layer here — Nigiri owns
# bitcoind, electrs, Esplora, and chopsticks (`nigiri start` first).
# Dev-only values below (secret "dev", plain HTTP). Production wraps the
# same service in Caddy + TLS per docs/infra-contract.md.
services:
  infra-api:
    build: ./api
    ports:
      # Jumpable: scripts/boot.sh sets INFRA_API_PORT when :8081 is taken.
      - "${INFRA_API_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BITCOIN_RPC_URL: http://host.docker.internal:18443
      BITCOIN_RPC_USER: admin1
      BITCOIN_RPC_PASSWORD: "123"
      ELECTRS_HTTP_URL: http://host.docker.internal:30000
      ESPLORA_URL: http://host.docker.internal:5000
      ANVIL_RPC_URL: http://anvil:8545
      INFRA_SHARED_SECRET: dev
      ADMIN_MINE_TOKEN: dev
    depends_on:
      anvil:
        condition: service_healthy

  # Anvil (Foundry) local Ethereum devnet: automines, prefunded accounts,
  # Anvil-native faucet (setBalance) and mining. Chain 31337, worthless coins.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--port", "8545"]
    environment:
      # --host is ignored by this image's arg parsing; the env var binds all ifaces.
      ANVIL_IP_ADDR: 0.0.0.0
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Our own Esplora UI. Nigiri ships one on :5000, but on macOS AirPlay owns
  # that port — so we run the same image on :5001 (jumpable via ESPLORA_PORT)
  # with its browser-side API pointed straight at electrs (CORS is open).
  # The wallet links regtest txs here (ESPLORA_PUBLIC_URL).
  esplora-ui:
    image: ghcr.io/vulpemventures/esplora:latest
    ports:
      - "${ESPLORA_PORT:-5001}:5000"
    environment:
      API_URL: http://localhost:30000
      CORS_ALLOW: "*"
    # The image ships no curl; node (v16, http module — no global fetch) probes.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/',function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
